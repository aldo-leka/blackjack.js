name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "front/**"
      - "docker-compose.yml"
      - "scripts/deploy-front.sh"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blackjack-front-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aldo-leka/blackjack.js-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://blackjackapi.aldo.al
            NEXT_PUBLIC_FRONTEND_URL=https://blackjack.aldo.al

  deploy:
    needs: build-and-push
    runs-on:
      - self-hosted
      - deploy
      - blackjack-vps

    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy on VPS
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          /root/blackjack.js/scripts/deploy-front.sh "$IMAGE_TAG"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
